<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commonwealth Schools Chess Championship 2026</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      text-align: center;
      background: #eef3fb;
      padding: 15px;
      margin: 0;
    }
    h2 { color: #003366; font-size: 1.25em; margin-bottom: 3px; margin-top: 10px; }
    h4 { color: #555; margin-top: 0; margin-bottom: 15px; font-size: 0.95em; }
    
    button {
      padding: 12px 24px;
      font-size: 1em;
      border-radius: 8px;
      border: none;
      background: #0057e7;
      color: white;
      cursor: pointer;
      margin-bottom: 15px;
      font-weight: bold;
    }
    button:disabled { background: #ccc; cursor: not-allowed; }
    
    /* Camera Viewport Layout */
    .scanner-container {
      margin: 5px auto;
      max-width: 320px;
      background: #000;
      border-radius: 12px;
      display: none;
      clip-path: inset(20% 0% 20% 0% round 12px); 
      margin-top: -35px;    
      margin-bottom: -15px; 
    }
    #reader { width: 100%; }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0057e7;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      animation: spin 1s linear infinite;
      margin: 15px auto;
      display: none;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Active Dynamic Tracking Board */
    .board-title {
      text-align: left;
      max-width: 360px;
      margin: 20px auto 8px auto;
      font-size: 1em;
      color: #003366;
      font-weight: bold;
      border-bottom: 2px solid #cbdcf7;
      padding-bottom: 4px;
    }
    
    #activeBoard {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      margin-bottom: 30px;
    }

    /* Player Card */
    .player-card {
      background: white;
      padding: 12px 16px;
      border-radius: 10px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.08);
      width: 360px;
      max-width: 95vw;
      text-align: left;
      box-sizing: border-box;
      border-left: 5px solid red;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      position: relative;
    }
    .player-card:active {
      transform: scale(0.98);
      background: #f0f4f8;
    }
    .player-card h3 {
      margin: 0 0 6px 0;
      color: #003366;
      font-size: 1.1em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 75px;
    }

    /* Single-line Metadata Bar */
    .card-meta {
      font-size: 0.8em;
      color: #444;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      line-height: 1.3;
    }
    .card-meta .divider {
      color: #aaa;
    }
    .country-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }
    .flag-icon {
      width: 18px;
      height: 13px;
      object-fit: cover;
      border-radius: 2px;
      box-shadow: 0 0 1px rgba(0,0,0,0.4);
      vertical-align: middle;
    }

    /* Live Warning Timer Tag */
    .timer-tag {
      position: absolute;
      right: 14px;
      top: 12px;
      font-size: 0.85em;
      font-weight: bold;
      color: red;
      background: #fff0f0;
      padding: 2px 6px;
      border-radius: 4px;
    }
    
    .player-card.overtime {
      background: #ffcccc;
      border-left: 5px solid #cc0000;
    }
    .player-card.overtime .timer-tag {
      background: #cc0000;
      color: white;
    }
  </style>
</head>
<body>

  <h2>Commonwealth Schools Chess Championship 2026</h2>
  <h4>Toilet Occupancy Board</h4>
  
  <button id="scanBtn">Start QR Code Scanner</button>

  <div class="scanner-container" id="scannerContainer">
    <div id="reader"></div>
  </div>

  <div class="spinner" id="spinner"></div>

  <div class="board-title">Players Currently In Toilet:</div>
  <div id="activeBoard"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz0EisO7xMvYXaizy50UbuX7SwhDviFYX5sobXmchFYO_glSBJZqFaEFikvP-vlSl3Zpg/exec";
    
    const scanBtn = document.getElementById('scanBtn');
    const spinner = document.getElementById('spinner');
    const activeBoard = document.getElementById('activeBoard');
    const scannerContainer = document.getElementById('scannerContainer');

    let html5QrcodeScanner = null;
    let lastScanId = "";
    let lastScanTime = 0;
    let activePlayers = {}; 

    function onScanSuccess(decodedText, decodedResult) {
      const userId = decodedText.trim();
      const now = Date.now();

      if (userId === lastScanId && now - lastScanTime < 4000) return;

      lastScanId = userId;
      lastScanTime = now;
      spinner.style.display = "block";

      processAttendance(userId);
    }

    function startScan() {
      scannerContainer.style.display = "block";
      scanBtn.innerText = "Scanner Active";
      scanBtn.disabled = true;

      html5QrcodeScanner = new Html5Qrcode("reader");
      
      const config = { 
        fps: 20, 
        qrbox: { width: 220, height: 220 }, 
        aspectRatio: 1.0 
      };

      html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess, 
        (errorMessage) => { console.log(errorMessage); }
      )
      .catch(err => {
        alert("Camera Access Error: " + err);
        stopScan();
      });
    }

    function stopScan() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          scannerContainer.style.display = "none";
          scanBtn.innerText = "Start QR Code Scanner";
          scanBtn.disabled = false;
        }).catch(err => console.error(err));
      }
    }

    async function processAttendance(userId) {
      try {
        const res = await fetch(`${API_URL}?userId=${encodeURIComponent(userId)}`, {
          method: "GET",
          redirect: "follow"
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        
        if (data.error) {
          alert(`System Error: ${data.error}`);
          return;
        }

        handleBoardUpdate(data, userId);
      } catch (err) { 
        alert("Data Transfer Error: Could not connect to spreadsheet.");
      } finally {
        spinner.style.display = "none";
      }
    }

    function handleBoardUpdate(data, userId) {
      if (data.status === "In") {
        activePlayers[userId] = {
          // Supports either column header format from your Apps Script payload
          fideId: data.fideId || data["FIDE ID"] || data.id || userId,
          name: data.name || data["NAME"] || "Unknown Player",
          category: data.category || data["CATEGORY"] || "—",
          nationality: data.nationality || data["NATIONALITY"] || "",
          flagUrl: data.countryFlag || data["Country Flag"] || data.flag || "",
          outTime: new Date()
        };
      } else if (data.status === "Out") {
        delete activePlayers[userId];
      }
      renderBoard();
    }

    function manualClear(userId, playerName) {
      const confirmOverride = confirm(`Misscan Override:\nChange ${playerName} status to "OUT" (Returned to hall) manually?`);
      if (confirmOverride) {
        spinner.style.display = "block";
        delete activePlayers[userId];
        renderBoard();
        processAttendance(userId);
      }
    }

    function renderBoard() {
      activeBoard.innerHTML = "";
      
      const entries = Object.entries(activePlayers);
      if (entries.length === 0) {
        activeBoard.innerHTML = "<p style='color:#777; font-size:0.9em; margin-top:10px;'>Toilet is currently empty.</p>";
        return;
      }

      entries.reverse().forEach(([userId, player]) => {
        const card = document.createElement("div");
        card.className = "player-card";
        card.id = `card-${userId}`;
        
        card.onclick = () => manualClear(userId, player.name);

        const flagImageTag = player.flagUrl 
          ? `<img src="${player.flagUrl}" class="flag-icon" alt="${player.nationality}" onerror="this.style.display='none'">` 
          : '';

        card.innerHTML = `
          <div class="timer-tag" id="timer-${userId}">0m 0s</div>
          <h3>${player.name}</h3>
          <div class="card-meta">
            <span><b>FIDE ID:</b> ${player.fideId}</span>
            <span class="divider">|</span>
            <span><b>CATEGORY:</b> ${player.category}</span>
            <span class="divider">|</span>
            <span class="country-tag">
              ${flagImageTag}
              <span>${player.nationality}</span>
            </span>
          </div>
        `;

        activeBoard.appendChild(card);
      });

      updateTimers();
    }

    function updateTimers() {
      const now = new Date();
      let hasActiveCards = false;

      Object.entries(activePlayers).forEach(([userId, player]) => {
        hasActiveCards = true;
        const timerElement = document.getElementById(`timer-${userId}`);
        const cardElement = document.getElementById(`card-${userId}`);
        
        if (timerElement && cardElement) {
          const elapsedMs = now - player.outTime;
          const totalSecs = Math.floor(elapsedMs / 1000);
          const mins = Math.floor(totalSecs / 60);
          const secs = totalSecs % 60;

          timerElement.innerText = `${mins}m ${secs}s`;

          if (mins >= 5) {
            cardElement.classList.add("overtime");
          } else {
            cardElement.classList.remove("overtime");
          }
        }
      });

      if (hasActiveCards) {
        setTimeout(updateTimers, 1000);
      }
    }

    scanBtn.addEventListener("click", startScan);
    renderBoard();
  </script>
</body>
</html>
